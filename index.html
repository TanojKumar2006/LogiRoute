<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>LogiRoute – Delivery Operations</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--sf:#fff;--bd:#e3e7ee;--tx:#1b2433;--mu:#6b778c;--ac:#2563eb;--acs:#e8f0fe;--ok:#16a34a;--wr:#d97706;--er:#dc2626;--map:#eef2f7;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1520;--sf:#171f2d;--bd:#2a3547;--tx:#e6ebf3;--mu:#8e9bb2;--ac:#6b9cff;--acs:#1c2a48;--map:#1b2536;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1520;--sf:#171f2d;--bd:#2a3547;--tx:#e6ebf3;--mu:#8e9bb2;--ac:#6b9cff;--acs:#1c2a48;--map:#1b2536;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.login .card{padding:24px;width:min(420px,100%)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;padding:4px 8px 14px}
.logo i{background:var(--ac);color:#fff;border-radius:7px;width:26px;height:26px;display:grid;place-items:center;font-style:normal}
nav button{display:flex;width:100%;gap:9px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left;color:var(--mu)}
nav button:hover{background:var(--bg)}nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
main{padding:0 16px 24px;min-width:0}
header.top{display:flex;gap:10px;align-items:center;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.menu{display:none}.sp{flex:1}
.pill{border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:4px 10px}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:7px;padding:6px 11px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.d{color:var(--er)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.kpi b{font-size:24px}.kpi span{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{padding:14px}h2{font-size:15px;margin:0 0 10px}h3{margin:0 0 6px;font-size:13px}
.ship{border:1px solid var(--bd);border-radius:9px;padding:10px;margin-bottom:8px;display:flex;gap:8px;cursor:pointer;background:var(--sf)}
.ship.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}.ship .tr{width:150px;flex:none}
.tag{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--mu)}
.st{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.s-Pending{background:#fef3c7;color:#92400e}.s-Planned{background:#e0e7ff;color:#3730a3}.s-Assigned{background:#cffafe;color:#155e75}
.s-In\ Transit{background:#dbeafe;color:#1d4ed8}.s-Delivered{background:#dcfce7;color:#166534}.s-Failed{background:#fee2e2;color:#991b1b}
.s-Unserved{background:#f3e8ff;color:#6b21a8}.s-Exception{background:#ffedd5;color:#9a3412}
.mapbox{background:var(--map);border-radius:9px;position:relative;overflow:hidden;border:1px solid var(--bd)}
.mapbox svg{display:block;width:100%;height:auto}
.det{position:absolute;left:8px;right:8px;bottom:8px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px}
.det small{color:var(--mu);display:block}
.note{font-size:11px;color:var(--mu);margin-top:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;cursor:pointer}
input[type=search],input[type=text],input[type=number],input[type=password],select{border:1px solid var(--bd);background:var(--sf);border-radius:7px;padding:6px 9px;max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ac)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.toast{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:20}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}.dlg .card{padding:18px;max-width:420px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;left:-240px;width:230px;z-index:25;transition:left .2s}aside.open{left:0}.menu{display:inline-block}.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.ship .tr{width:110px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="root"></div>
<script>
// ---------- helpers & synthetic data (seeded, deterministic) ----------
const TODAY=new Date('2026-10-28T09:00:00Z');
let seed=20261022;const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
const $=s=>s;const fmtD=d=>d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
const C={Kadapa:[14.47,78.82],Chennai:[13.08,80.27],Bengaluru:[12.97,77.59],Hyderabad:[17.38,78.48],Tirupati:[13.63,79.42],Vijayawada:[16.51,80.65],Kurnool:[15.83,78.04],Nellore:[14.44,79.99],Visakhapatnam:[17.69,83.22],Coimbatore:[11.02,76.96],Mysuru:[12.3,76.64],Anantapur:[14.68,77.6]};
const km=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h))*1.25)};
const CARR=['BlueDart','DTDC','Delhivery','India Post','Ecom Express'],CAT=['Books','Electronics','Equipment','Home Décor','Children’s','Groceries','Pharma'];
const DRV=['Ravi Kumar','Anil Reddy','Sana Sheikh','Mohan Rao','Priya Nair','Imran Khan','Lakshmi Devi','Suresh Babu'];
const VEH=[];for(let i=1;i<=8;i++)VEH.push({id:'VEH-00000'+i,type:i%3?'Semi-trailer':'Box truck',cap:i%3?18000:6000,vol:i%3?60:24,driver:'DRV-00000'+i,dname:DRV[i-1],status:i==7?'Maintenance':'Available',shift:'06:00–14:00',color:['#2563eb','#0d9488','#c2410c','#7c3aed'][i%4]});
const stat=['Pending','Planned','Assigned','In Transit','In Transit','Delivered','Failed','Pending'];
const dests=Object.keys(C).filter(k=>k!='Kadapa');
const SH=[];for(let i=1;i<=36;i++){const d=dests[Math.floor(rnd()*dests.length)],w=Math.round(rnd()*2400+20),st=stat[Math.floor(rnd()*stat.length)];
const dist=km(C.Kadapa,C[d]),v=['Pending'].includes(st)?null:VEH[Math.floor(rnd()*6)];
const eta=new Date(TODAY.getTime()+((st=='Delivered'||st=='Failed')?-1:1)*(Math.ceil(dist/55/8)+Math.floor(rnd()*2))*864e5);
SH.push({id:'DEL-2026-'+String(i).padStart(6,'0'),ord:'ORD-2026-'+String(i).padStart(6,'0'),cat:CAT[i%7],carrier:CARR[i%5],dest:d,dist,w,val:Math.round(w*(40+rnd()*60)),st,veh:v,eta,prog:st=='In Transit'?+(0.2+rnd()*.6).toFixed(2):st=='Delivered'?1:0,prio:1+i%3,win:'09:00–17:00',reason:st=='Failed'?'Customer unavailable':''})}
const EV=SH.map(s=>({id:s.id,t:'Created'}));
let AUD=[{t:new Date(TODAY),a:'system',x:'Dataset generated (seed 20261022)',e:'dataset'}];
let EXC=[{id:'EXC-001',type:'Capacity exceeded',sev:'High',ent:'RTE-2026-000004',txt:'Planned load 19,400 kg vs capacity 18,000 kg',act:'Move 1,400 kg to another vehicle',res:'Open'},
{id:'EXC-002',type:'Time window missed',sev:'Medium',ent:'DEL-2026-000009',txt:'ETA 17:40 is after window end 17:00',act:'Re-sequence stops or contact customer',res:'Open'},
{id:'EXC-003',type:'Driver shift exceeded',sev:'High',ent:'DRV-000003',txt:'Route ends 15:10, shift ends 14:00',act:'Split route across two drivers',res:'Open'}];
SH.filter(s=>s.st=='Failed').forEach((s,i)=>EXC.push({id:'EXC-1'+i,type:'Failed delivery',sev:'Medium',ent:s.id,txt:s.reason,act:'Reschedule delivery',res:'Open'}));
const PERM={admin:['dash','ship','plan','live','cust','orders','fleet','drivers','exc','ana','aud','set'],planner:['dash','ship','plan','live','cust','orders','fleet','drivers','exc','ana'],operator:['dash','ship','live','fleet','drivers','exc'],analyst:['dash','ship','ana','exc','aud'],viewer:['dash','ship']};
const NAV={dash:['▦','Dashboard'],ship:['📦','Shipments'],plan:['🧭','Route Planner'],live:['📡','Live Tracking'],cust:['📍','Customer Sites'],orders:['🧾','Orders'],fleet:['🚚','Vehicles'],drivers:['👤','Drivers & Shifts'],exc:['⚠','Exceptions'],ana:['📊','Analytics'],aud:['🗂','Audit History'],set:['⚙','Settings']};
const CAN={plan:['admin','planner'],run:['admin','planner','operator'],resolve:['admin','planner','operator'],cfg:['admin'],create:['admin','planner']};
const S={user:null,role:null,page:'dash',sel:SH.find(s=>s.st=='In Transit').id,q:'',f:'All',sort:'id',asc:true,pg:0,plan:null,pick:new Set(),theme:'',menu:false,tz:'Asia/Kolkata',err:''};
const can=a=>CAN[a].includes(S.role);
const log=(a,x,e)=>AUD.unshift({t:new Date(),a:S.user,x,e});
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const badge=s=>`<span class="st s-${s}">${s}</span>`;
function truck(c='#2563eb',w=150){return `<svg viewBox="0 0 220 80" width="${w}" role="img" aria-label="Delivery truck"><defs><linearGradient id="g${c.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfd6e1"/></linearGradient></defs>
<ellipse cx="110" cy="74" rx="100" ry="4" fill="#0002"/><rect x="4" y="12" width="136" height="48" rx="3" fill="url(#g${c.slice(1)})" stroke="#aab4c3"/>
<rect x="4" y="38" width="136" height="7" fill="${c}"/><rect x="8" y="22" width="40" height="6" rx="2" fill="${c}" opacity=".85"/>
<path d="M146 60V30l10-13h28l12 17v26z" fill="${c}"/><path d="M158 21h22l8 13h-30z" fill="#bfe3ff" stroke="#fff" stroke-width="1.5"/>
<rect x="141" y="58" width="76" height="6" rx="2" fill="#2b3342"/><rect x="209" y="46" width="7" height="6" rx="1" fill="#fde68a"/>
${[26,44,100,118,172].map(x=>`<g><circle cx="${x}" cy="64" r="9" fill="#1f2530"/><circle cx="${x}" cy="64" r="4" fill="#9aa5b8"/></g>`).join('')}</svg>`}
function mapSvg(list,selId){const P=c=>[40+(c[1]-76)*(320/7.5),270-(c[0]-11)*(250/7)];const dp=P(C.Kadapa);
let o=`<svg viewBox="0 0 400 290" role="img" aria-label="Route map (synthetic coordinates)"><rect width="400" height="290" fill="none"/>`;
for(const [n,c] of Object.entries(C)){const p=P(c);o+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--mu)"/><text x="${p[0]+5}" y="${p[1]+3}" font-size="8" fill="var(--mu)">${n}</text>`}
list.forEach(s=>{const p=P(C[s.dest]),on=s.id==selId;const mx=(dp[0]+p[0])/2+12,my=(dp[1]+p[1])/2-14;
o+=`<path d="M${dp[0]} ${dp[1]} Q${mx} ${my} ${p[0]} ${p[1]}" fill="none" stroke="${on?'var(--ac)':'var(--bd)'}" stroke-width="${on?2.6:1.2}" ${s.st=='Planned'||s.st=='Assigned'?'stroke-dasharray="4 3"':''}/>`;
if(on){const t=s.prog,x=(1-t)**2*dp[0]+2*(1-t)*t*mx+t*t*p[0],y=(1-t)**2*dp[1]+2*(1-t)*t*my+t*t*p[1];
o+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="var(--ac)"/><g transform="translate(${x-9},${y-9})"><rect width="18" height="18" rx="4" fill="#111"/><text x="9" y="13" text-anchor="middle" font-size="11">🚚</text></g>`}});
return o+`<rect x="${dp[0]-6}" y="${dp[1]-6}" width="12" height="12" fill="#16a34a" stroke="#fff"/><text x="${dp[0]-30}" y="${dp[1]+18}" font-size="9" font-weight="700" fill="var(--tx)">Depot Kadapa</text></svg>`}
const sel=()=>SH.find(s=>s.id==S.sel);
function filtered(){let l=SH.filter(s=>(S.f=='All'||s.st==S.f)&&(s.id+s.dest+s.carrier+s.cat+(s.veh?.dname||'')).toLowerCase().includes(S.q.toLowerCase()));
l.sort((a,b)=>{const x=a[S.sort],y=b[S.sort];return (x>y?1:x<y?-1:0)*(S.asc?1:-1)});return l}
// ---------- pages ----------
function kpis(){const n=s=>SH.filter(x=>s.includes(x.st)).length;
const k=[['Total deliveries',SH.length],['Assigned',n(['Assigned','Planned','In Transit'])],['Pending',n(['Pending'])],['Delivered',n(['Delivered'])]];
return `<div class="kpis">${k.map(x=>`<div class="card kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="row"><span class="tag">Failed ${n(['Failed'])}</span><span class="tag">Unserved ${n(['Unserved'])}</span><span class="tag">Open exceptions ${EXC.filter(e=>e.res=='Open').length}</span></div>`}
function shipCard(s){return `<div class="ship ${s.id==S.sel?'on':''}" tabindex="0" onclick="S.sel='${s.id}';R()" onkeydown="if(event.key=='Enter'){S.sel='${s.id}';R()}">
<div style="flex:1;min-width:0"><small style="color:var(--mu)">Shipment ID</small><br><b>${s.id}</b><div class="row" style="margin:4px 0"><span class="tag">${s.cat}</span><span class="tag">${s.carrier}</span>${badge(s.st)}</div>
<div>Depot → ${s.dest}</div><div class="note">${s.dist} km · ${s.veh?s.veh.id+' · '+s.veh.dname:'No vehicle yet'}<br><b>${s.st=='Delivered'?'Delivered':s.st=='Failed'?'Attempted':'Expected'}: ${fmtD(s.eta)}</b></div></div>
<div class="tr">${truck(s.veh?s.veh.color:'#64748b',150)}</div></div>`}
function detail(s){return `<div class="det"><div><small>Driver</small>${s.veh?s.veh.dname:'—'}</div><div><small>Tracking</small>${s.id}</div><div><small>Weight</small>${s.w} kg</div><div><small>Value</small>₹${s.val.toLocaleString('en-IN')}</div></div>`}
function table(list,pg=true){const per=8,pages=Math.max(1,Math.ceil(list.length/per)),rows=pg?list.slice(S.pg*per,S.pg*per+per):list;
const th=(k,l)=>`<th onclick="S.sort='${k}';S.asc=S.sort=='${k}'?!S.asc:true;R()">${l}${S.sort==k?(S.asc?' ▴':' ▾'):''}</th>`;
return `<div class="row"><input type="search" aria-label="Search" placeholder="Search tracking, city, driver…" value="${S.q}" oninput="S.q=this.value;S.pg=0;R(1)"><select aria-label="Status filter" onchange="S.f=this.value;S.pg=0;R()">${['All','Pending','Planned','Assigned','In Transit','Delivered','Failed','Unserved'].map(x=>`<option ${x==S.f?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="exportCsv()">Export CSV</button></div>
<div class="tw"><table><thead><tr>${th('id','Tracking')}${th('carrier','Carrier')}${th('cat','Category')}${th('eta','Delivery date')}${th('dest','Destination')}${th('w','Weight')}${th('val','Value')}${th('st','Status')}<th>Vehicle</th><th>Driver</th><th>Action</th></tr></thead><tbody>
${rows.map(s=>`<tr><td><b>${s.id}</b></td><td>${s.carrier}</td><td>${s.cat}</td><td>${fmtD(s.eta)}</td><td>${esc(s.rec.name)}, ${esc(s.rec.addr)}</td><td>${s.w} kg</td><td>₹${s.val.toLocaleString('en-IN')}</td><td>${badge(s.st)}</td><td>${s.veh?.id||'—'}</td><td>${s.veh?.dname||'—'}</td><td><button class="btn" onclick="S.sel='${s.id}';S.page='live';R()">Track</button></td></tr>`).join('')||'<tr><td colspan="11">No deliveries match. Clear the search or filter.</td></tr>'}</tbody></table></div>
<div class="row" style="margin-top:8px"><button class="btn" ${S.pg==0?'disabled':''} onclick="S.pg--;R()">Previous</button><span>Page ${S.pg+1} of ${pages} · ${list.length} results</span><button class="btn" ${S.pg+1>=pages?'disabled':''} onclick="S.pg++;R()">Next</button></div>`}
function exportCsv(){const q=v=>/^[=+\-@]/.test(String(v))?"'"+v:v;const rows=[['id','carrier','category','destination','weight_kg','status','eta'],...filtered().map(s=>[s.id,s.carrier,s.cat,s.dest,s.w,s.st,s.eta.toISOString().slice(0,10)])];
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(r=>r.map(q).join(',')).join('\n'));a.download='deliveries.csv';a.click();log('Exported deliveries CSV','report');toast('CSV exported')}
function dash(){const s=sel(),on=SH.filter(x=>['In Transit','Assigned','Planned'].includes(x.st));
return kpis()+`<div class="card pad" style="margin-bottom:12px"><h2>Ongoing deliveries</h2><div class="two"><div style="max-height:470px;overflow:auto">${on.slice(0,10).map(shipCard).join('')||'<p>No ongoing deliveries.</p>'}</div>
<div><div class="mapbox">${mapSvg(on,S.sel)}${detail(s)}</div><p class="note">Synthetic coordinates and simulated tracking. Connect a GPS/carrier provider to show live positions.</p></div></div></div>
<div class="card pad"><h2>Track orders</h2>${table(filtered())}</div>`}
function ship(){const s=sel();return `<div class="two"><div class="card pad"><h2>All shipments</h2>${table(filtered())}</div><div class="card pad"><h2>${s.id}</h2>${truck(s.veh?s.veh.color:'#64748b',230)}<p>${badge(s.st)} · ${s.cat} · ${s.carrier}</p>
<p>Order ${s.ord}<br>Route: Depot → ${s.dest} (${s.dist} km)<br>Deliver to: ${esc(s.rec.name)}, ${esc(s.rec.addr)}<br>Window ${s.win} · Priority ${s.prio}<br>Expected date: <b>${fmtD(s.eta)}</b></p>${s.reason?`<p>Failure reason: ${s.reason}</p>`:''}
<h3>Event timeline</h3>${evFor(s).map(e=>`<div class="note">• ${e.t}</div>`).join('')}
<div class="row" style="margin-top:8px">${can('run')?`<select id="ns">${['Pending','Planned','Assigned','In Transit','Delivered','Failed'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn p" onclick="setStatus()">Update status</button>`:'<span class="note">Read-only for your role.</span>'}${can('create')?`<button class="btn d" onclick="confirmDel()">Cancel shipment</button>`:''}</div></div></div>`}
const NEXT={Pending:['Planned','Unserved'],Planned:['Assigned','Pending'],Assigned:['In Transit','Planned'],'In Transit':['Delivered','Failed'],Failed:['Pending'],Delivered:[],Unserved:['Pending']};
function setStatus(){if(!can('run'))return toast('Not allowed for your role');const s=sel(),v=document.getElementById('ns').value;
if(!NEXT[s.st].includes(v)&&v!=s.st)return toast(`Invalid transition ${s.st} → ${v}`);
if(['Assigned','In Transit'].includes(v)&&!s.veh)s.veh=VEH.find(x=>x.status=='Available');
EV.push({id:s.id,t:`${s.st} → ${v} by ${S.user} (${new Date().toLocaleTimeString()})`});log(`Status ${s.st} → ${v}`,s.id);s.st=v;s.manual=true;if(v=='Delivered')s.prog=1;R();toast('Status updated')}
function confirmDel(){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>Cancel ${S.sel}?</h2><p>The shipment is marked Unserved and the action is recorded in the audit history.</p><div class="row"><button class="btn" id="n">Keep</button><button class="btn d" id="y">Cancel shipment</button></div></div>`;document.body.append(d);
d.querySelector('#n').onclick=()=>d.remove();d.querySelector('#y').onclick=()=>{const s=sel();s.st='Unserved';s.manual=true;s.veh=null;s.reason='Cancelled by planner';log('Cancelled',s.id);d.remove();R()}}
function plan(){const pend=SH.filter(s=>['Pending','Unserved'].includes(s.st));
return `<div class="card pad"><h2>Route planner</h2><p class="note">Plans a feasible route per vehicle: capacity, availability and priority are hard rules. Method: greedy nearest-stop heuristic — not mathematically optimal.</p>
<div class="row"><label>Planning date <input type="text" value="${fmtD(new Date(TODAY.getTime()+864e5))}" readonly></label><label>Traffic <select id="tf"><option value="1">Normal</option><option value="1.25">Heavy (+25%)</option></select></label>
<button class="btn p" ${can('plan')?'':'disabled title="Planner or admin role required"'} onclick="runPlan()">Run optimization (${pend.length} deliveries)</button></div>
${S.plan?planView():'<p>No plan yet. Run optimization to preview routes before committing.</p>'}</div>`}
function runPlan(){const tf=+document.getElementById('tf').value;const pend=SH.filter(s=>['Pending','Unserved'].includes(s.st)).sort((a,b)=>a.prio-b.prio||a.dist-b.dist);
const vs=VEH.filter(v=>v.status=='Available').map(v=>({v,load:0,stops:[],t:6*60}));const un=[];const t0=performance.now();
for(const s of pend){const maxCap=Math.max(...vs.map(x=>x.v.cap));if(s.w>maxCap){un.push({s,why:'Weight exceeds every vehicle capacity'});continue}
const hrs=s.dist/55*tf*60;const c=vs.filter(x=>x.load+s.w<=x.v.cap&&x.t+hrs<=14*60*3).sort((a,b)=>a.load-b.load)[0];
if(!c){un.push({s,why:'No vehicle with remaining capacity or shift time'});continue}
c.load+=s.w;c.t+=hrs+30;c.stops.push(s)}
const used=vs.filter(x=>x.stops.length);S.plan={id:'PLAN-'+String(Date.now()).slice(-6),tf,used,un,ms:Math.round(performance.now()-t0),dist:used.reduce((a,x)=>a+x.stops.reduce((b,s)=>b+s.dist,0),0),committed:false};
log('Plan previewed',S.plan.id);R()}
function planView(){const p=S.plan;return `<div class="two"><div><div class="row"><span class="tag">Run ${p.id}</span><span class="tag">Solver: heuristic (feasible, not proven optimal)</span><span class="tag">${p.ms} ms</span></div>
<p>Routes <b>${p.used.length}</b> · Assigned <b>${p.used.reduce((a,x)=>a+x.stops.length,0)}</b> · Unserved <b>${p.un.length}</b> · Distance <b>${p.dist} km</b></p>
${p.used.map(x=>`<div class="card pad" style="margin-bottom:8px"><b>${x.v.id}</b> · ${x.v.dname} ${truck(x.v.color,90)}<div class="bar"><i style="width:${Math.round(x.load/x.v.cap*100)}%"></i></div><div class="note">Load ${x.load}/${x.v.cap} kg (${Math.round(x.load/x.v.cap*100)}%)</div>
${x.stops.map((s,i)=>`<div class="note">${i+1}. ${s.id} → ${s.dest} · ETA ${fmtD(new Date(TODAY.getTime()+864e5*(1+Math.floor(s.dist*p.tf/55/8))))}</div>`).join('')}</div>`).join('')}
${p.un.map(u=>`<div class="note" style="color:var(--er)">Unserved ${u.s.id}: ${u.why}</div>`).join('')}
<div class="row"><button class="btn p" ${can('plan')&&!p.committed?'':'disabled'} onclick="commitPlan()">Commit plan</button><button class="btn" onclick="S.plan=null;R()">Reject</button></div></div>
<div class="mapbox">${mapSvg(p.used.flatMap(x=>x.stops.map(s=>({...s,st:'Planned',prog:0}))),null)}</div></div>`}
function commitPlan(){if(!can('plan'))return toast('Not allowed');const p=S.plan;p.used.forEach(x=>x.stops.forEach(s=>{if(!['Pending','Unserved'].includes(s.st))return;s.veh=x.v;s.manual=true;s.st='Assigned';s.eta=new Date(TODAY.getTime()+864e5*(1+Math.floor(s.dist*p.tf/55/8)));EV.push({id:s.id,t:`Assigned to ${x.v.id} in ${p.id}`})}));
p.un.forEach(u=>{u.s.st='Unserved';u.s.manual=true;u.s.reason=u.why});p.committed=true;log('Plan committed',p.id);toast('Plan committed — deliveries assigned');R()}

D.vehicles.forEach(v=>VEH.push({id:v[0],type:v[1],cap:v[2],vol:v[3],status:v[4],driver:v[5]>=0?D.drivers[v[5]][0]:'—',dname:v[5]>=0?D.drivers[v[5]][1]:'Unassigned',shift:'08:00–16:00 or 10:00–18:00',color:'#fff'}));
D.drivers.forEach(d=>DRVS.push({id:d[0],name:d[1],phone:d[2],email:d[3],addr:d[4],lic:d[5],veh:(VEH.find(v=>v.driver==d[0])||{id:'—'}).id}));
const ATT=D.deliveries.map(()=>[]);
D.routes.forEach((r,ri)=>r[8].forEach((s,k)=>ATT[s[0]].push({ri,k})));
ATT.forEach(a=>a.sort((x,y)=>D.routes[x.ri][4]-D.routes[y.ri][4]));
D.deliveries.forEach((d,i)=>{const st=D.sites[d[2]];SIDX[d[0]]=i;SH.push({i,id:d[0],ord:d[1],cat:d[6],carrier:D.partners[d[7]][0],dest:st[4],dist:Math.round(hv(M.depot,[st[2],st[3]])*1.35),w:d[3],val:Math.round(d[4]),st:'Pending',veh:null,eta:new Date(),prog:0,prio:d[5],win:fmtT(d[8])+'–'+fmtT(d[9]),reason:'',rec:{name:st[5],phone:st[6],email:st[7],addr:st[1]},site:d[2],cur:null})});
S.now=M.demo_day*1440+M.demo_min;S.auto=false;S.auto2=false;S.ef='Open';
function recompute(){const now=S.now;SH.forEach(s=>{if(s.manual)return;const a=ATT[s.i],d=D.deliveries[s.i];let cur=null;for(const x of a)if(D.routes[x.ri][4]<=now)cur=x;let st;
 if(!cur){if(a.length){cur=a[0];const r=D.routes[cur.ri];st=dayOf(r[4])<=dayOf(now)?'Assigned':'Planned'}else{s.st=d[10]>=0&&d[10]<=dayOf(now)?'Unserved':'Pending';s.veh=null;s.cur=null;s.reason=d[11];s.eta=absDate(Math.max(d[10],0)*1440+d[9]);s.prog=0;return}}
 else{const x=D.routes[cur.ri][8][cur.k];st=x[4]<=now?(x[5]?'Failed':'Delivered'):'In Transit'}
 const r=D.routes[cur.ri],x=r[8][cur.k];if(!s.cur||s.cur.ri!==cur.ri)s.veh=Object.assign({},VEH[r[2]],{driver:D.drivers[r[3]][0]});
 s.cur=cur;s.st=st;s.eta=absDate(st=='Delivered'||st=='Failed'?x[3]:x[1]);s.reason=st=='Failed'?x[6]:'';s.prog=st=='Delivered'||st=='Failed'?1:r[8].filter(y=>y[4]<=now).length/r[8].length})}
function rebuildExc(){EXC.length=0;D.exceptions.forEach(e=>{if(e[7]>dayOf(S.now))return;EXC.push({id:e[0],type:e[2]=='UNSERVED_DELIVERY'?'Unserved delivery':'Failed delivery',sev:e[3],ent:D.deliveries[e[1]][0],txt:e[4],act:e[5],res:RESOLVED.has(e[0])?'Resolved':e[6]=='OPEN'?'Open':'Rescheduled'})})}
recompute();rebuildExc();
S.sel=(SH.find(s=>s.st=='In Transit')||SH[0]).id;
AUD.push({t:new Date(),a:'system',x:`Dataset loaded: ${M.counts.deliveries} deliveries, ${M.counts.routes} routes (seed ${M.seed}, synthetic)`,e:'dataset'});
const drvOf=s=>s.veh?(DRVS.find(d=>d.id==s.veh.driver)||{name:'Unassigned',phone:'',email:'',addr:''}):null;
function evFor(s){const o=[],a=ATT[s.i];o.push('Created (synthetic order '+s.ord+')');a.forEach((x,n)=>{const r=D.routes[x.ri],y=r[8][x.k];o.push(`Attempt ${n+1}: planned on ${r[0]}, ETA ${fmtDT(y[1])}`);if(y[4]<=S.now)o.push(`Attempt ${n+1}: ${y[5]?'FAILED ('+y[6]+')':'DELIVERED'} at ${fmtDT(y[4])} (simulated)`)});const d=D.deliveries[s.i];if(!a.length&&d[10]>=0)o.push('Unserved: '+d[11]);return o.map(t=>({t})).concat(EV.filter(e=>e.id==s.id))}
const fmtDT=a=>absDate(a).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function truckPos(ri,now){const r=D.routes[ri],dp=M.depot,st=r[8];let t=r[4],p=dp;const segs=[];
 st.forEach((s,k)=>{const q=sp(s[0]);segs.push({a:t,b:s[3],p,q,k,ty:'leg'});segs.push({a:s[3],b:s[4],p:q,q,k,ty:'stop'});t=s[4];p=q});
 segs.push({a:t,b:t+Math.max(r[5]-st[st.length-1][2],1),p,q:dp,k:st.length,ty:'back'});
 if(now<r[4])return{pos:dp,state:'Waiting at depot',k:-1,head:1,kmh:0};
 for(const g of segs){const last=g===segs[segs.length-1];if(now<g.b||last){const f=g.b>g.a?Math.min(1,Math.max(0,(now-g.a)/(g.b-g.a))):1;
  return{pos:[g.p[0]+(g.q[0]-g.p[0])*f,g.p[1]+(g.q[1]-g.p[1])*f],k:g.k,head:g.q[1]>=g.p[1]?1:-1,kmh:g.ty=='stop'||now>=g.b?0:Math.round(hv(g.p,g.q)*1.35/((g.b-g.a)/60)),
  state:last&&now>=g.b?'Back at depot':g.ty=='leg'?`Driving to stop ${g.k+1} of ${st.length}`:g.ty=='stop'?`At stop ${g.k+1} of ${st.length}`:'Returning to depot'}}}}
const P=(la,lo)=>[20+(lo-78.25)/.45*360,280-(la-17.2)/.4*260];
function routeMap(s){const dp=P(M.depot[0],M.depot[1]);let o='<svg viewBox="0 0 400 300" role="img" aria-label="Route map with synthetic coordinates">';
 for(let i=0;i<=5;i++){const x=20+i*72,y=20+i*52;o+=`<path d="M${x} 20V280M20 ${y}H380" stroke="var(--bd)" stroke-width=".6"/>`}
 D.sites.forEach(t=>{const p=P(t[2],t[3]);o+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.2" fill="var(--mu)" opacity=".5"/>`});
 if(s.cur){const r=D.routes[s.cur.ri];let path=`M${dp[0]} ${dp[1]}`;r[8].forEach(x=>{const q=P(...sp(x[0]));path+=`L${q[0].toFixed(1)} ${q[1].toFixed(1)}`});path+=`L${dp[0]} ${dp[1]}`;
  o+=`<path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>`;
  r[8].forEach((x,k)=>{const q=P(...sp(x[0])),done=x[4]<=S.now,me=x[0]==s.i;o+=`<circle cx="${q[0]}" cy="${q[1]}" r="${me?8:6}" fill="${done?(x[5]?'#dc2626':'#16a34a'):'var(--sf)'}" stroke="${me?'#f59e0b':'var(--ac)'}" stroke-width="${me?3:1.5}"/><text x="${q[0]}" y="${q[1]+3}" text-anchor="middle" font-size="8" font-weight="700" fill="${done?'#fff':'var(--tx)'}">${k+1}</text>`});
  const tp=truckPos(s.cur.ri,S.now),q=P(tp.pos[0],tp.pos[1]);o+=`<g transform="translate(${q[0]},${q[1]-9}) scale(${tp.head*.17},.17) translate(-120,-40)">${TRK}</g>`}
 return o+`<rect x="${dp[0]-6}" y="${dp[1]-6}" width="12" height="12" fill="#16a34a" stroke="#fff"/><text x="${dp[0]+9}" y="${dp[1]+4}" font-size="9" font-weight="700" fill="var(--tx)">Depot</text></svg>`}
function mapSvg(list,selId){if(selId)return routeMap(SH[SIDX[selId]]);const dp=P(M.depot[0],M.depot[1]);let o='<svg viewBox="0 0 400 300" role="img" aria-label="Planned stops (synthetic)">';
 list.forEach(s=>{const t=D.sites[s.site],p=P(t[2],t[3]);o+=`<path d="M${dp[0]} ${dp[1]}L${p[0]} ${p[1]}" stroke="var(--bd)"/><circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`});return o+`<rect x="${dp[0]-6}" y="${dp[1]-6}" width="12" height="12" fill="#16a34a"/></svg>`}
function detail(s){const d=drvOf(s);return `<div class="det"><div><small>Driver</small>${d?esc(d.name)+'<br>'+tel(d.phone):'—'}</div><div><small>Deliver to</small>${esc(s.rec.name)}<br>${esc(s.dest)}</div><div><small>Weight</small>${s.w} kg</div><div><small>Window</small>${s.win}</div></div>`}
const clockBar=()=>`<div class="row"><span class="pill">Simulation clock: ${fmtClock(S.now)}</span><span class="note">Synthetic dataset: ${M.counts.deliveries} deliveries, 1–30 Oct 2026, seed ${M.seed}. Tracking is simulated.</span></div>`;
function dash(){const on=SH.filter(x=>x.st=='In Transit').concat(SH.filter(x=>x.st=='Assigned')).slice(0,8),s=sel();
 return clockBar()+kpis()+`<div class="card pad" style="margin-bottom:12px"><h2>Ongoing deliveries</h2><div class="two"><div style="max-height:480px;overflow:auto">${on.map(shipCard).join('')||'<p>No ongoing deliveries at this simulated time.</p>'}</div><div><div class="mapbox">${routeMap(s)}${detail(s)}</div><p class="note">Selected ${s.id} · ${s.st}. Green = delivered, red = failed, white = upcoming.</p></div></div></div><div class="card pad"><h2>Track orders</h2>${table(filtered())}</div>`}
function adv(m){S.now=Math.min(S.now+m,29*1440+1439);recompute();rebuildExc();R()}
function resetClock(){S.now=M.demo_day*1440+M.demo_min;SH.forEach(s=>{delete s.manual});recompute();rebuildExc();R()}
function live(){const s=sel(),cur=s.cur,r=cur?D.routes[cur.ri]:null,x=r?r[8][cur.k]:null,tp=cur?truckPos(cur.ri,S.now):null,drv=drvOf(s),pt=PART.find(p=>p.name==s.carrier);
 const opts=SH.filter(y=>y.st=='In Transit').slice(0,80);if(!opts.includes(s))opts.unshift(s);
 const left=x&&x[4]>S.now&&tp?Math.round(hv(tp.pos,sp(s.i))*1.35):0,fin=x&&x[4]<=S.now;
 const track=x?`<div class="kpis" style="margin:8px 0"><div class="card kpi"><span>Speed</span><b>${tp.kmh} km/h</b></div><div class="card kpi"><span>To destination</span><b>${left} km</b></div><div class="card kpi"><span>State</span><b style="font-size:12px">${tp.state}</b></div><div class="card kpi"><span>GPS</span><b style="font-size:12px">${tp.pos[0].toFixed(4)}, ${tp.pos[1].toFixed(4)}</b></div></div>
 <div class="tw"><table style="min-width:0"><tbody><tr><td>Delivery window</td><td>${s.win} IST</td></tr><tr><td>Planned ETA</td><td>${fmtDT(x[1])}</td></tr><tr><td>Planned departure</td><td>${fmtDT(x[2])}</td></tr><tr><td>Simulated arrival</td><td>${x[3]<=S.now?fmtDT(x[3]):'—'}</td></tr><tr><td>Actual departure</td><td>${fin?fmtDT(x[4]):'—'}</td></tr><tr><td>Recorded outcome</td><td>${fin?(x[5]?'Failed — '+x[6]:'Delivered'):'Not yet'}</td></tr></tbody></table></div>`:`<p>No route: ${esc(s.reason||'not yet planned')}. See Exceptions or re-plan in the Route Planner.</p>`;
 return `<div class="card pad"><h2>Live tracking <span class="tag">Simulated from dataset</span></h2><div class="row"><select aria-label="Shipment" onchange="S.sel=this.value;R()">${opts.map(y=>`<option value="${y.id}" ${y.id==S.sel?'selected':''}>${y.id} · ${y.st}</option>`).join('')}</select><span class="pill">${fmtClock(S.now)}</span><label><input type="checkbox" ${S.auto2?'checked':''} onchange="S.auto2=this.checked"> Run clock</label><button class="btn" onclick="adv(10)">+10 min</button><button class="btn" onclick="adv(60)">+1 hour</button><button class="btn" onclick="resetClock()">Reset</button></div>
 <div class="two"><div><div class="mapbox">${routeMap(s)}</div><div class="card pad" style="margin-top:8px">${truck('',240)}<div class="row">${badge(s.st)}<b>${s.id}</b><span class="tag">${s.veh?s.veh.id:'No truck'}</span><span class="tag">${r?r[0]:'No route'}</span></div>${track}</div></div>
 <div>${r?`<div class="card pad" style="margin-bottom:8px"><h3>Route stops (${r[8].length}) · ${r[6]} km · ${Math.round(r[7])} kg</h3>${r[8].map((y,k)=>`<div class="note">${k+1}. ${D.deliveries[y[0]][0]} ${y[4]<=S.now?(y[5]?'✗ failed':'✓ delivered'):'· ETA '+fmtT(y[1]%1440)}${y[0]==s.i?' ← selected':''}</div>`).join('')}</div>`:''}
 ${person('Driver',drv?drv.name:'Not assigned',drv?.phone,drv?.email,drv?drv.addr:'—')}${person('Delivery partner',pt.name+' ('+pt.contact+')',pt.phone,pt.email,pt.addr)}${person('Shipping to',s.rec.name,s.rec.phone,s.rec.email,s.rec.addr)}</div></div></div>`}
setInterval(()=>{if(!S.user||S.page!='live'||!S.auto2||['SELECT','INPUT'].includes(document.activeElement?.tagName))return;S.now=Math.min(S.now+3,29*1440+1439);recompute();rebuildExc();R()},2000);
function resolveE(id){const e=EXC.find(x=>x.id==id);e.res='Resolved';RESOLVED.add(id);log('Exception resolved',id);R()}
function exc(){const f=S.ef,l=EXC.filter(e=>f=='All'||e.res==f);return `<div class="card pad"><h2>Exceptions (${l.length})</h2><div class="row"><select aria-label="Status" onchange="S.ef=this.value;R()">${['Open','Rescheduled','Resolved','All'].map(x=>`<option ${x==f?'selected':''}>${x}</option>`).join('')}</select><span class="note">Showing the first 40. Operational exceptions come from the dataset rules (failed or unserved deliveries).</span></div>
 ${l.slice(0,40).map(e=>`<div class="ship" style="cursor:default"><div style="flex:1"><b>${e.type}</b> <span class="tag">${e.sev}</span> <span class="tag">${e.res}</span><div class="note">${e.ent}: ${esc(e.txt)}<br>Recommended: ${esc(e.act)}</div></div>${e.res=='Open'&&can('resolve')?`<button class="btn" onclick="resolveE('${e.id}')">Resolve</button>`:''}</div>`).join('')||'<p>No exceptions match.</p>'}</div>`}
function cust(){return gen(`Customer sites (${D.sites.length}; first 100 shown)`,['Site','Area','Lat','Lon','Contact','Phone','Max vehicle'],D.sites.slice(0,100).map(t=>[esc(t[0]),t[4],t[2],t[3],esc(t[5]),tel(t[6]),t[8]]))}
function orders(){return gen(`Orders & deliveries (${SH.length}; first 150 shown)`,['Order','Delivery','Category','Weight','Value','Status'],SH.slice(0,150).map(s=>[s.ord,s.id,s.cat,s.w+' kg','₹'+s.val.toLocaleString('en-IN'),s.st]))}
function evalPage(){const e=M.evaluation,o=e.overall,pc=x=>(x*100).toFixed(1)+'%';
 return `<div class="card pad"><h2>Dataset & evaluation</h2><div class="kpis"><div class="card kpi"><span>Precision</span><b>${pc(o.precision)}</b></div><div class="card kpi"><span>Recall</span><b>${pc(o.recall)}</b></div><div class="card kpi"><span>F1</span><b>${pc(o.f1)}</b></div><div class="card kpi"><span>Injected anomalies</span><b>${o.injected}</b></div></div>
 <p class="note">The rules and the injected anomalies were written together, so this shows rule coverage on a labelled fixture, not independent accuracy. Valid baseline: ${M.validation.rule_issues} rule issues, ${M.validation.integrity} structural violations; SQL seed loads with foreign keys enforced: ${M.validation.sqlite_fk_ok?'yes':'no'}; regenerated with the same seed gives identical files: ${M.reproducible?'yes':'no'}.</p>
 <h3>Per anomaly type</h3>${gen('',['Type','Injected','TP','FP','FN','Precision','Recall','F1'],e.per_type.map(t=>[t.type,t.injected,t.true_positive,t.false_positive,t.false_negative,pc(t.precision),pc(t.recall),pc(t.f1)]))}
 <h3>Tables, row counts and checksums (sha256, first 12)</h3>${gen('',['Table','Rows','Checksum'],Object.keys(M.counts).map(k=>[k,M.counts[k],M.checksums[k]]))}</div>`}
Object.assign(NAV,{eval:['🧪','Data & Evaluation']});PERM.admin.push('eval');PERM.analyst.push('eval');PAGES.eval=evalPage;

recompute();
R();
